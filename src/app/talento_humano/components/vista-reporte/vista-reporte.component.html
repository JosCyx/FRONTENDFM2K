<app-menu-tthh></app-menu-tthh>
<div class="container">
  <h1 style="text-align: center"><b>LISTADO REPORTE</b></h1>
  <div class="formulariodiv">
    <div style="width: 100%">
      <div style="display: flex; flex-direction: row; gap: 10px">
        <!-- <mat-form-field>
          <mat-label>Seleccione el Metodo de Busqueda</mat-label>
          <mat-select
            mat-select
            [value]="opSelected()"
            (selectionChange)="onOpChange()"
          >
            <mat-option *ngFor="let op of opList()" [value]="op">
              {{ op }}
            </mat-option>
          </mat-select>
        </mat-form-field> -->
        <div class="custom-form"></div>
        <mat-form-field>
          <mat-label>Selecciona la Fecha de Inicio</mat-label>
          <input
            matInput
            [matDatepicker]="picker1"
            [value]="selectedFechaInicio()"
            (dateChange)="onchangeFechaInicio($event.value)"
          />
          <mat-datepicker-toggle
            matIconSuffix
            [for]="picker1"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker1></mat-datepicker>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Selecciona la Fecha de Fin</mat-label>
          <input
            matInput
            [matDatepicker]="picker2"
            [value]="selectedFechaFin()"
            (dateChange)="onchangeFechaFin($event.value)"
          />
          <mat-datepicker-toggle
            matIconSuffix
            [for]="picker2"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker2 color="primary"></mat-datepicker>
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="menu">
    <div class="Diagrama">
      <app-graph [data]="" />
    </div>
    <div class="tabla">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

        <!-- Position Column -->
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef>No.</th>
          <td mat-cell *matCellDef="let element">{{ element.position }}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="weight">
          <th mat-header-cell *matHeaderCellDef>Weight</th>
          <td mat-cell *matCellDef="let element">{{ element.weight }}</td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="symbol">
          <th mat-header-cell *matHeaderCellDef>Symbol</th>
          <td mat-cell *matCellDef="let element">{{ element.symbol }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</div>
